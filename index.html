  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {

n  --color-accent-2-300: #c7c7c9;\n  --color-accent-2-400: #a1a1a4;\n  --color-accent-2-500: #79797d;\n  --color-accent-2-600: #58585c;\n  --color-accent-2-700: #3a3a3c;\n  --color-accent-2-800: #2a2a2c;\n  --color-accent-2-900: #1d1d1f;\n\n  --font-heading: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;\n  --font-heading-weight: 600; /* review round 3: bold retired — semibold is the\n     interface headings' ceiling (they need the weight at small sizes); display\n     text goes lighter still, to the normal cut (see the deck) */\n  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;\n\n  --space-1: 4.6px;\n  --space-2: 9.2px;\n  --space-3: 13.8px;\n  --space-4: 18.4px;\n  --space-6: 27.6px;\n  --space-8: 36.8px;\n\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 18px;\n  --radius-pill: 980px;\n  --color-diep: #3b2e24;\n\n  /* Diepbruin als tekstkleur werkt op beige, maar op zwart is het onleesbaar (gemeten\n     1,55:1). Daarom een eigen token in plaats van --color-diep rechtstreeks. */\n  --diep-tekst: #3b2e24;\n\n  /* Deze drie stonden als vaste kleur inline op de paginawortel. Inline stijl wint van\n     elke mediaquery, dus in donkere modus bleven ze hangen; nu wijzen ze naar een token. */\n  --merk-inkt: #1d1d1f;\n  --merk-grijs: #585249;\n  --knop-tekst: #ffffff;\n\n  /* ── De tekeningen ─────────────────────────────────────────────────────\n     De vaste kleuren uit de SVG's staan hier als token, zodat ze in donkere modus\n     mee kunnen. Ze stonden als fill=\"#ffffff\" in de tekening zelf; een\n     presentatie-attribuut kan geen var() aan, dus ze zijn verhuisd naar een\n     style-attribuut. */\n  --t-vlak: #ffffff;\n  --t-vlak-zacht: #f1eeea;\n  --t-inkt: #1d1d1f;\n  --t-lijn: #cfcac4;\n  --t-lijn-zacht: #e4dfd9;\n  --t-rand: #e8e4df;\n  --t-schets: #8a8279;\n  --t-stippel: #bdb5ab;\n  --t-verloop-1: #d8d1c8;\n  --t-verloop-2: #c2b8ad;\n  /* De donkerbruine baan is merk en blijft in beide standen dezelfde kleur. */\n  --t-diep: #3b2e24;\n  --t-diep-op: #efe9e2;\n  --t-diep-zacht: #a3907c;\n\n  /* ── Liquid Glass ──────────────────────────────────────────────────────\n     Vier waarden die overal gelijk moeten zijn, dus vier tokens en geen veertig\n     losse schaduwregels. Dezelfde namen als in ACCRD en SCRNN: hetzelfde materiaal\n     hoort in alle drie de repositories hetzelfde te heten, anders is \"verstel het\n     glas\" weer drie keer zoeken.\n\n     Het effect komt niet van het glas maar van de kleur eronder — zonder licht\n     achter het paneel is glas alleen maar grijs. Vandaar --color-glas-licht-*. */\n  --glas-bg: linear-gradient(142deg, rgba(255,255,255,0.58), rgba(255,255,255,0.20) 46%, rgba(255,255,255,0.36));\n  /* De navigatiebalk is het enige glas dat over zowel de lichte pagina als de\n     donkerbruine baan schuift. Met --glas-bg verkleurde hij mee tot de tekst\n     erop wegviel (2,59:1); deze basis blijft licht genoeg om overal te lezen. */\n  --glas-nav-bg: linear-gradient(142deg, rgba(255,255,255,0.78), rgba(255,255,255,0.58) 46%, rgba(255,255,255,0.70));\n  --glas-rand: rgba(255,255,255,0.58);\n  --glas-schaduw: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -18px 34px rgba(255,255,255,0.20), 0 26px 64px rgba(29,29,31,0.20);\n  --glas-blur: blur(30px) saturate(190%);\n\n  --glas-dun-bg: linear-gradient(142deg, rgba(255,255,255,0.52), rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.34));\n  --glas-dun-blur: blur(18px) saturate(170%);\n  --glas-dun-schaduw: inset 0 1px 0 rgba(255,255,255,0.80), 0 10px 26px rgba(29,29,31,0.12);\n\n  /* Glas op de donkerbruine baan is een ander materiaal: veel minder wit, want het\n     licht komt daar van boven in plaats van overal vandaan. */\n  --glas-diep-bg: linear-gradient(142deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05) 48%, rgba(255,255,255,0.11));\n  --glas-diep-rand: rgba(255,255,255,0.20);\n  --glas-diep-schaduw: inset 0 1px 0 rgba(255,255,255,0.34), 0 22px 50px rgba(0,0,0,0.30);\n  --glas-diep-blur: blur(26px) saturate(150%);\n\n  /* De dekkende tegenhanger voor browsers zonder backdrop-filter. Nagerekend als het\n     vlak dat het glas gemiddeld oplevert boven --color-bg, zodat er niets verspringt. */\n  --glas-vast: #e4d8cb;\n  --glas-glans: linear-gradient(112deg, transparent 26%, rgba(255,255,255,0.62) 44%, transparent 62%);\n\n  --color-glas-licht-terracotta: #c98a63;\n  --color-glas-licht-olijf: #8d9472;\n  --color-glas-licht-zand: #e8dccc;\n  --color-glas-licht-diep: #3b2e24;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.03);\n  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);\n  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.14), 0 4px 12px rgba(0, 0, 0, 0.06);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.plate{position:relative;box-sizing:border-box;overflow:hidden;border-radius:var(--radius-lg);\n  background:var(--glas-bg);\n  backdrop-filter:var(--glas-blur);-webkit-backdrop-filter:var(--glas-blur);\n  border:1px solid var(--glas-rand);box-shadow:var(--glas-schaduw)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; -webkit-font-smoothing: antialiased; letter-spacing: -0.006em; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 6px;\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n.divider-glass {\n  height: 1px; border: 0; margin: 32px 0;\n  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);\n  box-shadow: 0 0 20px rgba(255,255,255,0.15);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.4);\n  border-radius: var(--radius-pill);\n  transition: background .2s ease, color .2s ease, transform .2s ease;\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: #ffffff; background: var(--color-accent); border-color: transparent; }\n.btn-primary:hover { background: var(--color-accent-2); }\n.btn-primary:active { background: #000000; }\n.btn-secondary { border-color: var(--glas-rand); background: var(--glas-dun-bg);\n  backdrop-filter: var(--glas-dun-blur); -webkit-backdrop-filter: var(--glas-dun-blur);\n  box-shadow: var(--glas-dun-schaduw); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--glas-dun-bg);\n  backdrop-filter: var(--glas-dun-blur); -webkit-backdrop-filter: var(--glas-dun-blur);\n  box-shadow: var(--glas-dun-schaduw);\n  border: 1px solid var(--glas-rand); border-radius: var(--radius-pill);\n  padding-inline: calc(var(--space-3) * 1.4);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-4); border-radius: var(--radius-lg); background: var(--color-surface);\n  border: 1px solid var(--color-divider); box-shadow: var(--shadow-sm);\n  transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease;\n}\n.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 1px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg); border: 1px solid var(--color-divider);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"2d23836d-1a06-4f1e-ad6a-8dceba567356\"><\u002Fscript>\n  <script src=\"076748c6-ee2f-4821-a85b-46191630d23f\"><\u002Fscript>\n  <style>\n    html { scroll-behavior: smooth; }\n    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\n    body { margin: 0; text-wrap: pretty; }\n\n    /* ── Responsief ──────────────────────────────────────────────────\n       De pagina had geen enkele media query: de tweekolomssecties bleven\n       ook op een telefoon naast elkaar staan (175px naast 146px) en de\n       navigatieknop liep het scherm uit. Hieronder klappen de secties in\n       en wijkt de navigatie terug tot logo + actieknop; alle links staan\n       ook in de voettekst. */\n    @media (max-width: 860px) {\n      .dc-split { grid-template-columns: minmax(0, 1fr) !important; }\n      /* kop eerst, beeld eronder — de tekst moet leiden op een smal scherm */\n      .dc-split > figure { order: 1; max-width: 520px; margin-inline: auto; width: 100%; }\n    }\n    @media (max-width: 700px) {\n      .nav > a[href^=\"#\"]:not(.btn) { display: none; }\n      .nav .btn-primary { font-size: 13.5px; padding: 10px 16px; }\n      .nav .taal { margin-right: 8px; }\n      .nav { gap: 12px; }\n    }\n    @media (max-width: 520px) {\n      .card { padding: var(--space-3); }\n    }\n    a { color: var(--brand-ink); }\n    /* Merknaam in lopende tekst met de spatiëring van het woordmerk. De letters\n       staan niet los in de HTML, zodat 'LuzeX' één woord blijft voor schermlezers\n       en zoekmachines. */\n    .merk { letter-spacing: 0.22em; font-weight: 600; margin-right: -0.22em; }\n\n    /* Taalwissel in de navigatie */\n    .taal { display: inline-flex; align-items: center; gap: 2px; padding: 3px;\n      border: 1px solid var(--color-divider); border-radius: var(--radius-pill);\n      margin-right: 20px; }\n    .taal button { appearance: none; border: 0; background: transparent; cursor: pointer;\n      font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em;\n      /* 55% van de tekstkleur haalde 3,21:1 op de pagina en 1,99:1 waar de\n         navigatie over de donkerbruine baan schuift. Vast en donkerder dus. */\n      color: #4a3f35;\n      padding: 5px 11px; border-radius: var(--radius-pill);\n      transition: background .2s ease, color .2s ease; }\n    .taal button:hover { color: var(--color-text); }\n    .taal .taal-aan { background: var(--color-text); color: var(--color-bg); }\n\n    /* Contactformulier en directe kanalen, op de donkere baan */\n    .veld::placeholder { color: #a08f7d; }\n    .veld:focus { outline: 2px solid rgba(236,230,223,0.5); outline-offset: 2px;\n      border-color: rgba(236,230,223,0.5); }\n    .veld:user-invalid { border-color: #e5a08f; }\n    .kanaal { display: flex; align-items: center; gap: 16px; text-decoration: none;\n      color: #ece6df; padding: 16px 18px; border-radius: 18px;\n      border: 1px solid rgba(236,230,223,0.18); margin-bottom: 12px;\n      transition: background .2s ease, border-color .2s ease, transform .2s ease; }\n    .kanaal:hover { background: rgba(255,255,255,0.07);\n      border-color: rgba(236,230,223,0.4); transform: translateY(-2px); color: #ece6df; }\n    .kanaal-icoon { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 999px;\n      display: flex; align-items: center; justify-content: center;\n      background: rgba(236,230,223,0.12); }\n    .kanaal-titel { display: block; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }\n    .kanaal-tekst { display: block; font-size: 14.5px; color: #c9b8a6; margin-top: 1px; }\n\n    /* ── Aanpak: volle banen die elkaar afwisselen ────────────────────────\n       Geen kaarten maar doorlopende banen. De even banen liggen op petrol,\n       de nieuwe complementaire kleur bij de warme greige, en lopen aan de\n       boven- en onderkant uit in transparant — zo ontstaat een zachte\n       overgang in plaats van een harde rand. Het lijnwerk in de graphics\n       krijgt zijn kleur van de baan, zodat hetzelfde beeld op beide\n       ondergronden klopt. */\n    .aanpak-rij { position: relative; padding: clamp(76px, 9vw, 132px) 0;\n      --g-zacht: #8a8279; --g-sterk: var(--brand-ink); --g-vlak: #ffffff; }\n    .aanpak-rij--diep { color: #ece6df; --g-zacht: #a3907c; --g-sterk: #ece6df; --g-vlak: #2a2019;\n      background: linear-gradient(180deg,\n        var(--color-bg) 0%, var(--color-diep) 7.5%,\n        var(--color-diep) 92.5%, var(--color-bg) 100%); }\n    .aanpak-in { max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px,5vw,72px);\n      display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr);\n      gap: clamp(36px, 6vw, 88px); align-items: center; }\n    .aanpak-rij--gedraaid .aanpak-tekst { order: 2; }\n    .aanpak-rij h3 { font-size: clamp(25px, 3vw, 38px); line-height: 1.15;\n      letter-spacing: -0.025em; font-weight: 700; margin: 0 0 20px; }\n    .aanpak-rij p { font-size: 17px; line-height: 1.66; margin: 0 0 14px;\n      max-width: 46ch; opacity: 0.82; }\n    .aanpak-rij p:last-child { margin-bottom: 0; }\n    .aanpak-beeld { margin: 0; }\n    .aanpak-beeld svg { width: 100%; height: auto; display: block; }\n    .g-z { stroke: var(--g-zacht); fill: none; }\n    .g-s { stroke: var(--g-sterk); fill: none; }\n    .g-vz { fill: var(--g-zacht); opacity: 0.5; }\n    .g-vlak { fill: var(--g-vlak); }\n    /* Alleen op de lichte banen: het witte vlak licht op uit de greige.\n       Op petrol zou een donkere slagschaduw juist wegvallen. */\n    .aanpak-rij:not(.aanpak-rij--diep) .g-vlak { filter: drop-shadow(0 10px 20px rgba(29,29,31,0.18)); }\n    .g-punt { fill: var(--g-sterk); }\n    /* Contact ligt op dezelfde diepe baan als de even aanpak-rijen, en vervaagt\n       aan beide kanten in de paginakleur. */\n    .band-diep { color: #ece6df;\n      background: linear-gradient(180deg, var(--color-bg) 0%, var(--color-diep) 7.5%,\n        var(--color-diep) 92.5%, var(--color-bg) 100%); }\n    .band-diep .input { background: rgba(255,255,255,0.07); border-color: rgba(236,230,223,0.28);\n      color: #ece6df; }\n    .band-diep .input::placeholder { color: #c9b8a6; }\n    .band-diep a { color: #ece6df; }\n    .band-diep .btn-primary:hover { background: #ffffff; }\n    @media (max-width: 880px) {\n      .aanpak-in { grid-template-columns: minmax(0,1fr); gap: 34px; }\n      /* beeld altijd ónder de tekst, ook in de gedraaide banen */\n      .aanpak-rij--gedraaid .aanpak-tekst { order: 0; }\n      .aanpak-beeld { max-width: 520px; }\n    }\n    /* De negatieve marge haalt de spatie weg die letter-spacing achter de\n       laatste letter zet; anders staat er een dubbel gat voor het volgende woord. */\n    a:hover { color: var(--brand-grey); }\n    @keyframes reveal-up { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:none} }\n    @keyframes reveal-left { from{opacity:0;transform:translateX(-32px)} to{opacity:1;transform:none} }\n    @keyframes reveal-right { from{opacity:0;transform:translateX(32px)} to{opacity:1;transform:none} }\n    @keyframes reveal-scale { from{opacity:0;transform:translateY(16px) scale(0.94)} to{opacity:1;transform:none} }\n    @media (prefers-reduced-motion: reduce) { [data-reveal] { animation: none !important; opacity: 1 !important; transform: none !important; } }\n    /* ══ Liquid Glass: het licht, de terugval en de twee animaties ══════════\n       De vlekken staan achter de hele pagina en niet in een sectie: het is\n       achtergrond. Ze staan langs de randen en niet onder de tekstkolommen —\n       dat is een contrasteis. Gemeten drukt een terracotta vlek die onder een\n       alinea doorloopt de gedempte tekst van deze pagina (74% van --color-text)\n       onder 4,5:1; achter glas mag dezelfde vlek juist vol doorkomen. */\n    .glas-licht { position: fixed; z-index: -1; pointer-events: none;\n      border-radius: 50%; filter: blur(80px); will-change: transform; }\n    .glas-licht--1 { width: 620px; height: 620px; right: -200px; top: -200px;\n      background: var(--color-glas-licht-terracotta); opacity: 0.55;\n      animation: glas-zweef-a 17s ease-in-out infinite alternate; }\n    .glas-licht--2 { width: 540px; height: 540px; right: -280px; top: 40vh;\n      background: var(--color-glas-licht-olijf); opacity: 0.42;\n      animation: glas-zweef-b 21s ease-in-out infinite alternate; }\n    /* Diep bruin is de enige vlek die tekst echt kan breken: hij zat eerst zo ver in beeld\n       dat de ACCRD-alinea eroverheen viel en op 1,5:1 uitkwam. Nu staat hij grotendeels\n       buiten het scherm — genoeg om het glas aan de rand diepte te geven, te weinig om\n       onder lopende tekst te komen. */\n    .glas-licht--3 { width: 640px; height: 640px; right: -420px; bottom: -420px;\n      background: var(--color-glas-licht-diep); opacity: 0.24;\n      animation: glas-zweef-c 24s ease-in-out infinite alternate; }\n    /* Zand is de enige vlek die links mag staan: licht op licht kost de lopende\n       tekst niets, waar terracotta en olijf dat wel doen. */\n    .glas-licht--4 { width: 460px; height: 460px; left: -200px; top: 10vh;\n      background: var(--color-glas-licht-zand); opacity: 0.60;\n      animation: glas-zweef-a 19s ease-in-out infinite alternate-reverse; }\n\n    @keyframes glas-zweef-a { 0% { transform: translate3d(0,0,0) scale(1); }\n      100% { transform: translate3d(90px,-60px,0) scale(1.14); } }\n    @keyframes glas-zweef-b { 0% { transform: translate3d(0,0,0) scale(1.08); }\n      100% { transform: translate3d(-110px,70px,0) scale(0.94); } }\n    @keyframes glas-zweef-c { 0% { transform: translate3d(0,0,0) scale(0.96); }\n      100% { transform: translate3d(60px,90px,0) scale(1.2); } }\n\n    /* De glans hoort bij het materiaal. Hij loopt over het ene hero-paneel en\n       nergens anders: meer dan één glans tegelijk en het wordt een casino. */\n    .hero-plaat::after { content: \"\"; position: absolute; inset: 0;\n      border-radius: inherit; pointer-events: none;\n      background: var(--glas-glans); background-size: 280% 100%;\n      opacity: 0.55; animation: glas-glans 9s cubic-bezier(.45,0,.2,1) infinite; }\n    @keyframes glas-glans { 0%, 62% { background-position: 150% 0; }\n      100% { background-position: -60% 0; } }\n\n    /* ── Animatie 1: losse regels worden één factuur ──────────────────────\n       Zeven seconden, in de hero-tekening die er al stond. De regels van het\n       voorste venster komen scheef aanvliegen en landen recht; de vinkjes\n       zetten zich daarna. De scheefstand staat per regel in de SVG als\n       --dx/--dy/--r: dat is gegeven per regel, geen stijlregel. */\n    .hero-regel { animation: hero-landen 7s cubic-bezier(.16,.84,.26,1) var(--beurt,0s) infinite;\n      transform-box: fill-box; transform-origin: center; }\n    @keyframes hero-landen {\n      0%   { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; }\n      9%   { opacity: 1; }\n      50%, 92% { transform: translate(0,0) rotate(0deg); opacity: 1; }\n      100% { transform: translate(0,0) rotate(0deg); opacity: 0; }\n    }\n    .hero-vink { stroke-dasharray: 34; animation: hero-vink 7s cubic-bezier(.2,.7,.2,1) var(--beurt,0s) infinite; }\n    @keyframes hero-vink {\n      0%, 52% { stroke-dashoffset: 34; opacity: 0; }\n      60% { opacity: 1; }\n      68%, 92% { stroke-dashoffset: 0; opacity: 1; }\n      100% { stroke-dashoffset: 0; opacity: 0; }\n    }\n    /* Het bovenste grafiekje vordert met de scrollbalk in plaats van met een klok.\n       Hier hangt de tijdlijn niet aan het element zelf (view()) maar aan de pagina\n       (scroll()): de hero staat al in beeld als de pagina laadt, dus er is geen\n       binnenkomst om aan te meten — wat telt is hoe ver je gescrold bent.\n\n       Het bereik loopt van de bovenkant tot 60vh. Daarna is het af: iemand die\n       verder leest hoort geen halve tekening achter te laten. Bij scrollstand nul\n       staan de regels los en scheef — dat is het beginbeeld van het verhaal en niet\n       een kapotte pagina, en één duimbeweging maakt het af.\n\n       Zonder ondersteuning (Firefox) blijft de lus van zeven seconden staan die\n       hierboven is gedefinieerd; dan draait hij gewoon op de klok. */\n    @supports (animation-timeline: scroll()) {\n      @media (prefers-reduced-motion: no-preference) {\n        .hero-regel {\n          animation: hero-landen-scroll linear both;\n          animation-timeline: scroll(root block);\n          /* In pixels en niet in vh. Een vh-bereik groeit mee met de schermhoogte, maar de\n             scrollstand waarop het paneel uit beeld verdwijnt doet dat niet: die ligt vast\n             in de opmaak, op 780px, en is op 1440x900, 1920x1080 en 1512x760 exact gelijk.\n             Met 60vh liep de laatste regel op een scherm van 1080px hoog nog door tot 820 —\n             veertig pixels nadat het paneel al weg was, en het laatste vinkje tot 900.\n             Hoe ver? De animatie hoort af te zijn als het paneel net over de helft van\n             het scherm is, niet als het bovenaan hangt. Met 340px stond de onderkant van\n             het paneel op 24 tot 44% van het scherm — dus vrijwel boven de vouw. Met deze\n             waarden staat hij op 46 tot 65%, afhankelijk van de schermhoogte: net over de\n             helft, precies waar het hoort. */\n          animation-range: 0 190px;\n        }\n        /* Elke regel begint een stukje later: met een scroll-tijdlijn bestaat\n           animation-delay niet, het bereik ís de vertraging. */\n        .hero-regel:nth-of-type(2) { animation-range: 22px 212px; }\n        .hero-regel:nth-of-type(3) { animation-range: 44px 234px; }\n        .hero-regel:nth-of-type(4) { animation-range: 66px 256px; }\n        .hero-regel:nth-of-type(5) { animation-range: 88px 278px; }\n\n        /* De regels beginnen zichtbaar, niet doorzichtig. Wie de pagina opent en niet\n           scrollt moet vijf losse, scheve regels zien — dat is het beginbeeld van het\n           verhaal. Begon het op opacity 0, dan stond er bij scrollstand nul een leeg\n           venster, en dat leest als een pagina die stuk is.\n\n           De scheefstand begint op 42% van de afstand die de lus gebruikt. Die lus laat de\n           regels van ver buiten het venster komen en het venster knipt; bij scrollstand nul\n           zou daar dus bijna niets staan. Vanaf 42% staan ze allemaal binnen de rand,\n           scheef en los — zichtbaar rommelig, wat precies het punt is. */\n        @keyframes hero-landen-scroll {\n          0% { transform: translate(calc(var(--dx) * 0.42), calc(var(--dy) * 0.42)) rotate(var(--r)); opacity: 0.55; }\n          30% { opacity: 1; }\n          100% { transform: translate(0,0) rotate(0deg); opacity: 1; }\n        }\n\n        .hero-vink {\n          animation: hero-vink-scroll linear both;\n          animation-timeline: scroll(root block);\n          animation-range: 200px 330px;\n        }\n\n        @keyframes hero-vink-scroll {\n          0% { stroke-dashoffset: 34; opacity: 0; }\n          20% { opacity: 1; }\n          100% { stroke-dashoffset: 0; opacity: 1; }\n        }\n      }\n    }\n\n    /* ── Animatie 2: de stroom door ACCRD ─────────────────────────────────\n       Negen seconden, op de donkerbruine baan. Een lichtpunt reist van\n       hoofdaannemer naar onderaannemer naar uitbetaling; elke stap licht op als\n       het werk aankomt. Het reist in procenten van de baan en niet in pixels:\n       een vaste afstand klopt op één schermbreedte en op geen enkele andere. */\n    .stroom { position: relative; margin: 0 0 26px; height: 30px; }\n    .stroom-lijn { position: absolute; left: 0; right: 0; top: 14px; height: 2px;\n      border-radius: 2px; transform-origin: left;\n      background: linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.75));\n      animation: stroom-spoor 9s cubic-bezier(.45,0,.2,1) infinite; }\n    .stroom-werk { position: absolute; left: 0; top: 2px; margin-left: -13px;\n      width: 26px; height: 26px; border-radius: 50%; background: #fdf8f2;\n      box-shadow: 0 0 26px 8px rgba(255,236,214,0.55);\n      animation: stroom-werk 9s cubic-bezier(.45,0,.2,1) infinite; will-change: left; }\n    @keyframes stroom-spoor { 0%, 6% { transform: scaleX(0); }\n      32%, 40% { transform: scaleX(0.5); } 62%, 100% { transform: scaleX(1); } }\n    @keyframes stroom-werk { 0% { left: 0; opacity: 0; }\n      4%, 10% { left: 0; opacity: 1; }\n      32%, 40% { left: 50%; opacity: 1; }\n      62%, 74% { left: 100%; opacity: 1; }\n      82%, 100% { left: 100%; opacity: 0; } }\n\n    .stroom-stap { position: relative; border-radius: 22px; padding: 22px 24px;\n      background: var(--glas-diep-bg);\n      backdrop-filter: var(--glas-diep-blur); -webkit-backdrop-filter: var(--glas-diep-blur);\n      border: 1px solid var(--glas-diep-rand); box-shadow: var(--glas-diep-schaduw);\n      animation: stap-oplichten 9s cubic-bezier(.2,.7,.2,1) infinite; }\n    .stroom-stap:nth-child(2) { animation-delay: 3s; }\n    .stroom-stap:nth-child(3) { animation-delay: 6s; }\n    @keyframes stap-oplichten {\n      0%, 4% { background-color: rgba(255,255,255,0); border-color: rgba(255,255,255,0.20); transform: translateY(0); }\n      /* 0,08 en niet 0,10: de opgelichte stap is het slechtste geval van deze animatie,\n         want daar wordt de ondergrond lichter terwijl de tekst licht blijft. Nagerekend\n         haalt #e3d3c0 op de opgelichte kaart boven de zwaarste vlek 4,76:1; met 0,10 was\n         dat 4,15:1. Het glas wordt dekkender, de tekst blijft. */\n      10%, 30% { background-color: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.55); transform: translateY(-6px); }\n      40%, 100% { background-color: rgba(255,255,255,0); border-color: rgba(255,255,255,0.20); transform: translateY(0); }\n    }\n\n    /* Terugval. Zonder deze regel wordt een paneel op oudere Android een grijze\n       mist waar de tekst in verdwijnt: daar bestaat backdrop-filter niet en\n       blijft alleen de halftransparante gradient over. */\n    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {\n      .plate, .input, .btn-secondary, .nav { background: var(--glas-vast); }\n      .stroom-stap { background: rgba(255,255,255,0.14); }\n      .glas-licht { display: none; }\n    }\n\n    /* Beweging is een aanbod. Wie er last van heeft, krijgt het eindbeeld stil —\n       niet het beginbeeld, want dan staat er een halve animatie. */\n    @media (prefers-reduced-motion: reduce) {\n      .glas-licht, .hero-plaat::after, .hero-regel, .hero-vink,\n      .stroom-lijn, .stroom-werk, .stroom-stap { animation: none !important; }\n      .stroom-lijn { transform: scaleX(1); }\n      .stroom-werk { left: 100%; }\n      .hero-vink { stroke-dashoffset: 0; opacity: 1; }\n    }\n\n    /* Op één kolom reist het werk niet meer van links naar rechts; dan is het\n       spoor een bewering die niet klopt en gaat het weg. */\n    @media (max-width: 760px) {\n      .stroom { display: none; }\n    }\n\n    /* Raakdoelen. De navigatie- en voettekstlinks waren 22px hoog en de taalknoppen 29px:\n       te klein om met een duim te raken. Het raakvlak groeit met verticale ruimte en een\n       negatieve marge, zodat het doel 44px wordt zonder dat er iets verschuift. */\n    .nav a, .nav .btn, footer a { display: inline-flex; align-items: center; min-height: 44px; }\n    /* .taal-aan is de knop die aan staat, niet de groep eromheen; de groep heet .taal. */\n    .taal button { min-height: 44px; }\n    .band-diep .btn, a.btn { min-height: 44px; }\n    .nav a:not(.btn), footer a { margin-block: -11px; }\n\n    /* ── Hetzelfde gebaar, maar gestuurd door de scrollbalk ────────────────\n       De hero-animatie hierboven loopt in een lus: die begint bij het laden en\n       herhaalt zich of je kijkt of niet. Deze doet hetzelfde — los aankomen,\n       recht landen — maar zijn voortgang hangt aan hoe ver jij gescrold bent.\n       Halverwege scrollen is halverwege de animatie; terugscrollen draait hem\n       terug.\n\n       animation-timeline: view() koppelt de voortgang aan de reis die het\n       element door het scherm maakt. Chrome en Safari kennen het, Firefox nog\n       niet. Daarom staat het in @supports en is de RUSTSTAND het eindbeeld:\n       waar het niet werkt staat gewoon de afgebouwde pagina en mist alleen de\n       beweging. Nooit andersom — een animatie die niet draait mag geen halve\n       pagina achterlaten.\n\n       Het telt ook niet mee voor de twee lopende animaties per pagina: zonder\n       scrollen beweegt hier niets. */\n    @supports (animation-timeline: view()) {\n      @media (prefers-reduced-motion: no-preference) {\n        /* De tijdlijn hangt aan de figuur, niet aan de vormen zelf: een SVG-vorm heeft geen\n           doos in de CSS-opmaak en view() heeft daar dus niets om aan te meten. De figuur\n           geeft de tijdlijn een naam, de vormen erbinnen verwijzen ernaar. */\n        .maat-plaat { view-timeline-name: --op-maat; view-timeline-axis: block; }\n\n        .maat-regel, .maat-tegel {\n          animation: maat-landen linear both;\n          animation-timeline: --op-maat;\n          transform-box: fill-box;\n          transform-origin: center;\n        }\n        /* Met een scroll-tijdlijn bestaat animation-delay niet: het bereik ís de\n           vertraging. Elke regel begint een stukje later dan de vorige. */\n        /* cover en niet entry: het \"entry\"-bereik is even lang als het element zelf, dus\n           bij een regel van negen pixels was de animatie al afgelopen voordat je hem zag.\n           Gemeten begon hij 120px vóór het element in beeld stond en was hij klaar na 23%\n           van de zichtbare reis. Het cover-bereik is de hele passage door het scherm. */\n        .maat-regel--1 { animation-range: cover 22% cover 56%; --kant: -70px; }\n        .maat-regel--2 { animation-range: cover 26% cover 60%; --kant: 70px; }\n        .maat-regel--3 { animation-range: cover 30% cover 64%; --kant: -70px; }\n        .maat-regel--4 { animation-range: cover 34% cover 68%; --kant: 70px; }\n        .maat-tegel--1 { animation-range: cover 38% cover 72%; --kant: -40px; }\n        .maat-tegel--2 { animation-range: cover 42% cover 76%; --kant: 40px; }\n\n        @keyframes maat-landen {\n          from { opacity: 0; transform: translateX(var(--kant, 0px)); }\n          to { opacity: 1; transform: none; }\n        }\n      }\n    }\n\n    /* ── Drie kleine gebaren, en niet meer ────────────────────────────────\n       Alles hieronder hangt aan de scrollbalk, dus zonder scrollen staat de\n       pagina stil. Dat is de hele truc waarmee het druk wordt óf niet: één\n       gebaar per tekening, kleine afstanden, en niets dat uit zichzelf begint.\n\n       Wat hier bewust NIET gebeurt: de icoontjes in de contactbalk blijven\n       stil, en op accrd.luzex.nl komt er niets bij. Die pagina heeft er al\n       vier; een vijfde maakt het rommelig in plaats van levend. */\n    @supports (animation-timeline: scroll()) {\n      @media (prefers-reduced-motion: no-preference) {\n\n        /* De grafieklijn tekent zichzelf terwijl je de hero uitscrolt. Een lijn\n           die getekend wordt is preciezer dan een lijn die invliegt: het is\n           dezelfde beweging als een pen, en die leest als techniek. 580 is de\n           lengte van het pad, ruim genomen — te krap en de lijn komt niet af. */\n        .hero-lijn {\n          stroke-dasharray: 580;\n          stroke-dashoffset: 310;\n          animation: lijn-tekenen linear both;\n          animation-timeline: scroll(root block);\n          /* De grafiek zit hoog in de hero en is rond 440px weggescrold; met 46vh (414px)\n             kwam het slot te dicht op die rand te liggen voor het punt dat erna hoort. */\n          animation-range: 0 130px;\n        }\n\n        /* De lijn begint half getekend en niet leeg. Wie de pagina opent en niet\n           scrolt moet een grafiek zien, geen leeg venster — dat laatste leest als\n           een pagina die nog laadt. Scrollen maakt hem af. */\n        @keyframes lijn-tekenen {\n          from { stroke-dashoffset: 310; }\n          to { stroke-dashoffset: 0; }\n        }\n\n        /* Het punt aan het eind komt pas als de lijn er is. */\n        .hero-punt {\n          transform-box: fill-box;\n          transform-origin: center;\n          animation: punt-zetten linear both;\n          animation-timeline: scroll(root block);\n          /* Het punt stond op 34vh-52vh, oftewel 306-468px — maar het punt zelf is al\n             rond 320px uit beeld. Het verscheen dus pas nadat je het niet meer kon zien.\n             Het punt hoort ná de lijn te komen, dus het begint waar de lijn eindigt:\n             130px-190px, ruim binnen beeld. Ook hier pixels en geen vh. */\n          animation-range: 130px 190px;\n        }\n\n        @keyframes punt-zetten {\n          from { opacity: 0; transform: scale(0.2); }\n          to { opacity: 1; transform: none; }\n        }\n\n        /* De drie vinkjes in de ACCRD-tekening zetten zich één voor één, en de\n           donkere knop komt 8px omhoog als ze alle drie staan. Acht pixels is\n           genoeg om te zien en te weinig om op te vallen. */\n        .acc-plaat { view-timeline-name: --accrd-plaat; view-timeline-axis: block; }\n\n        .acc-vink {\n          stroke-dasharray: 64;\n          animation: vink-tekenen linear both;\n          animation-timeline: --accrd-plaat;\n        }\n\n        .acc-vink--1 { animation-range: cover 24% cover 52%; }\n        .acc-vink--2 { animation-range: cover 30% cover 58%; }\n        .acc-vink--3 { animation-range: cover 36% cover 64%; }\n\n        @keyframes vink-tekenen {\n          from { stroke-dashoffset: 64; opacity: 0; }\n          25% { opacity: 1; }\n          to { stroke-dashoffset: 0; opacity: 1; }\n        }\n\n        .acc-knop {\n          animation: knop-op linear both;\n          animation-timeline: --accrd-plaat;\n          animation-range: cover 42% cover 70%;\n        }\n\n        @keyframes knop-op {\n          from { transform: translateY(8px); opacity: 0.55; }\n          to { transform: none; opacity: 1; }\n        }\n\n        /* De staven in de aanpak-tekeningen komen een klein stukje omhoog, per\n           staaf iets later. Geen enkele staaf verplaatst meer dan zijn eigen\n           dikte; het is het verschil tussen de staven dat je ziet, niet de\n           beweging zelf. */\n        .aanpak-rij { view-timeline-name: --aanpak; view-timeline-axis: block; }\n\n        .g-vz {\n          transform-box: fill-box;\n          transform-origin: center bottom;\n          animation: staaf-op linear both;\n          animation-timeline: --aanpak;\n          animation-range: cover 20% cover 54%;\n        }\n\n        .g-vz:nth-of-type(2) { animation-range: cover 23% cover 57%; }\n        .g-vz:nth-of-type(3) { animation-range: cover 26% cover 60%; }\n        .g-vz:nth-of-type(4) { animation-range: cover 29% cover 63%; }\n        .g-vz:nth-of-type(5) { animation-range: cover 32% cover 66%; }\n        .g-vz:nth-of-type(6) { animation-range: cover 35% cover 69%; }\n\n        @keyframes staaf-op {\n          from { transform: scaleY(0.88) translateY(6px); opacity: 0.6; }\n          to { transform: none; opacity: 1; }\n        }\n\n        /* De twee punten op de lijn verschijnen na de staven. */\n        .g-punt {\n          transform-box: fill-box;\n          transform-origin: center;\n          animation: punt-zetten linear both;\n          animation-timeline: --aanpak;\n          animation-range: cover 38% cover 72%;\n        }\n      }\n    }\n\n    /* ── De stroom door ACCRD aan de scrollbalk ───────────────────────────\n       De laatste lus die nog op een klok liep. Het lichtpunt reist nu terwijl\n       de baan door het scherm komt, en elke stap licht op als het punt er is.\n       Terugscrollen draait het terug.\n\n       De tijdlijn hangt hier aan de baan zelf (view()) en niet aan de pagina\n       (scroll()) zoals bij de hero: deze sectie staat halverwege de pagina, dus\n       de reis die hij door het scherm maakt is precies de maat die je wilt. De\n       hero heeft die reis niet — die staat er al als je aankomt.\n\n       Alle vier de animaties delen ÉÉN bereik en de timing zit in de keyframes,\n       niet in een eigen bereik per stap. Dat laatste probeerde ik eerst en het\n       werkte niet betrouwbaar: een bereik als \"entry 78% cover 36%\" loopt in de\n       verkeerde volgorde en levert dan een stap op die nooit aangaat. Met één\n       bereik staat het punt op 50% ook precies bij stap twee.\n\n       Daarmee beweegt er op deze pagina niets meer uit zichzelf, op de glans\n       over het hero-paneel na. */\n    @supports (animation-timeline: view()) {\n      @media (prefers-reduced-motion: no-preference) {\n        .stroom-baan { view-timeline-name: --stroom; view-timeline-axis: block; }\n\n        .stroom-lijn {\n          animation: spoor-scroll linear both;\n          animation-timeline: --stroom;\n          animation-range: cover 15% cover 72%;\n        }\n\n        @keyframes spoor-scroll { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n\n        .stroom-werk {\n          animation: werk-scroll linear both;\n          animation-timeline: --stroom;\n          animation-range: cover 15% cover 72%;\n        }\n\n        @keyframes werk-scroll { from { left: 0; opacity: 1; } to { left: 100%; opacity: 1; } }\n\n        .stroom-stap {\n          animation-timeline: --stroom;\n          animation-range: cover 15% cover 72%;\n          animation-timing-function: linear;\n          animation-fill-mode: both;\n        }\n\n        .stroom-stap:nth-child(1) { animation-name: stap-een; }\n        .stroom-stap:nth-child(2) { animation-name: stap-twee; }\n        .stroom-stap:nth-child(3) { animation-name: stap-drie; }\n\n        @keyframes stap-een {\n          0%, 16% { background-color: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.55); transform: translateY(-6px); }\n          30%, 100% { background-color: rgba(255,255,255,0); border-color: rgba(255,255,255,0.20); transform: translateY(0); }\n        }\n\n        @keyframes stap-twee {\n          0%, 36% { background-color: rgba(255,255,255,0); border-color: rgba(255,255,255,0.20); transform: translateY(0); }\n          44%, 60% { background-color: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.55); transform: translateY(-6px); }\n          70%, 100% { background-color: rgba(255,255,255,0); border-color: rgba(255,255,255,0.20); transform: translateY(0); }\n        }\n\n        @keyframes stap-drie {\n          0%, 80% { background-color: rgba(255,255,255,0); border-color: rgba(255,255,255,0.20); transform: translateY(0); }\n          90%, 100% { background-color: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.55); transform: translateY(-6px); }\n        }\n      }\n    }\n\n/* ══ Donkere modus ═══════════════════════════════════════════════════════\n   luzex.nl had er geen en stond dus altijd in het lichte beige, ook op een\n   apparaat dat om donker vraagt. accrd.luzex.nl volgt het systeem al, want die\n   pagina rijdt op styles.css en daar staat die modus in. Dit blok trekt dat\n   gelijk, met exact de waarden uit styles.css: #000 als grond, #1c1c1e als\n   paneel, #f5f5f7 als tekst en #98989d als tweede tekstkleur.\n\n   Het accent draait om. Op wit is grafiet het accent en wit de tekst erop; op\n   zwart is dat onzichtbaar, dus wordt het accent licht en de tekst erop donker.\n   Dat is dezelfde omkering die het logo zelf maakt — er is een zwarte en een\n   witte variant van hetzelfde merk.\n\n   De donkerbruine banen blijven bruin. Die kleur is merk, geen ondergrond. */\n@media (prefers-color-scheme: dark) {\n  :root {\n    --color-bg: #000000;\n    --color-surface: #1c1c1e;\n    --color-text: #f5f5f7;\n    --color-accent: #f5f5f7;\n    --color-accent-2: #d1d1d6;\n    --color-divider: rgba(255, 255, 255, 0.09);\n\n    --color-neutral-100: #2d2b2b;\n    --color-neutral-200: #444141;\n    --color-neutral-300: #605d5d;\n    --color-neutral-400: #7d7979;\n    --color-neutral-500: #9b9797;\n    --color-neutral-600: #bab6b6;\n    --color-neutral-700: #d7d3d3;\n    --color-neutral-800: #eae7e7;\n    --color-neutral-900: #f8f4f4;\n\n    --color-accent-100: #1d1d1f;\n    --color-accent-200: #2a2a2c;\n    --color-accent-300: #3a3a3c;\n    --color-accent-400: #58585c;\n    --color-accent-500: #79797d;\n    --color-accent-600: #a1a1a4;\n    --color-accent-700: #c7c7c9;\n    --color-accent-800: #e3e3e4;\n    --color-accent-900: #f2f2f3;\n\n    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);\n    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);\n    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.55);\n\n    /* Glas op zwart is een ander materiaal: veel minder wit, want het licht komt\n       daar van boven in plaats van overal vandaan. Dezelfde waarden als in\n       styles.css, zodat de twee sites hetzelfde glas dragen. */\n    --glas-bg: linear-gradient(142deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05) 48%, rgba(255,255,255,0.11));\n    --glas-rand: rgba(255,255,255,0.20);\n    --glas-schaduw: inset 0 1px 0 rgba(255,255,255,0.34), 0 22px 50px rgba(0,0,0,0.30);\n    --glas-blur: blur(26px) saturate(150%);\n    --glas-dun-bg: linear-gradient(142deg, rgba(255,255,255,0.13), rgba(255,255,255,0.04) 50%, rgba(255,255,255,0.09));\n    --glas-dun-blur: blur(16px) saturate(140%);\n    --glas-dun-schaduw: inset 0 1px 0 rgba(255,255,255,0.24), 0 10px 26px rgba(0,0,0,0.34);\n    --glas-vast: #1b1b1b;\n    --glas-glans: linear-gradient(112deg, transparent 26%, rgba(255,255,255,0.22) 44%, transparent 62%);\n\n    /* De tekeningen. Een wit paneel op een zwarte pagina is een lamp; het wordt\n       hier hetzelfde #1c1c1e als een paneel in het platform. */\n    --t-vlak: #1c1c1e;\n    --t-vlak-zacht: #232325;\n    --t-inkt: #f5f5f7;\n    --t-lijn: #4a4a4d;\n    --t-lijn-zacht: #37373a;\n    --t-rand: rgba(255, 255, 255, 0.12);\n    --t-schets: #7d7d82;\n    --t-stippel: #5a5a5e;\n    --t-verloop-1: #17171a;\n    --t-verloop-2: #0d0d0f;\n\n    --merk-inkt: #f5f5f7;\n    --merk-grijs: #98989d;\n    /* Het accent is op zwart licht, dus de letters erop worden donker. */\n    --knop-tekst: #1d1d1f;\n    /* Op zwart wordt het diepbruin een warm zand: 8,6:1 op de achtergrond. */\n    --diep-tekst: #c2a98f;\n  }\n\n  /* Op zwart telt elke vlek drie keer zo zwaar door; gemeten in styles.css. */\n  /* Gemeten naast accrd.luzex.nl: die had in donkere modus een spreiding van R46/G37/B28\n     in de marges, luzex.nl maar R36/G27/B20 — zichtbaar vlakker. Deze waarden brengen de\n     twee op elkaar zonder de tekst te raken; dat is daarna nagemeten. */\n  .glas-licht--1 { opacity: 0.23; }\n  .glas-licht--2 { opacity: 0.19; }\n  .glas-licht--3 { opacity: 0.26; }\n  .glas-licht--4 { opacity: 0.13; }\n\n  /* Het beeldmerk heeft kleur, dus omkeren mag niet meer: de donkere modus krijgt de\n     witte variant (wit woordmerk, warm zand als voet onder de torens). Geldt voor de\n     navigatie én de footer; de footer stond hier eerder zwart op zwart. */\n  .logo-licht { display: none !important; }\n  .logo-donker { display: block !important; }\n}\n.logo-licht { display: block; }\n.logo-donker { display: none; }\n\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"color:var(--color-text);font-family:var(--font-display);--font-display:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;--brand-ink:var(--merk-inkt);--brand-grey:var(--merk-grijs);--brand-bg:var(--color-bg)\">\n\n  <nav class=\"nav\" style=\"padding-inline:clamp(20px,5vw,72px);position:sticky;top:0;background:var(--glas-nav-bg);backdrop-filter:var(--glas-blur);-webkit-backdrop-filter:var(--glas-blur);z-index:20;border-bottom:1px solid var(--glas-rand);box-shadow:var(--glas-schaduw)\">\n    <a href=\"https://luzex.nl\" style=\"display:flex;align-items:center;margin-right:auto;text-decoration:none\">\n      <img class=\"logo-licht\" src=\"730711f1-cb25-4f3d-9351-dd979901cab4\" alt=\"LuzeX\" style=\"height:47px;width:auto\"><img class=\"logo-donker\" src=\"4b1c2e7a-9d3f-4c51-8a6e-2f7b0c9d1e35\" alt=\"LuzeX\" style=\"height:47px;width:auto\">\n    <\u002Fa>\n    <a href=\"#aanpak\" style=\"margin-right:28px\">Aanpak<\u002Fa>\n    <a href=\"#producten\" style=\"margin-right:28px\">Producten<\u002Fa>\n    <a href=\"#op-maat\" style=\"margin-right:28px\">Op maat<\u002Fa>\n    <a href=\"#contact\" style=\"margin-right:28px\">Contact<\u002Fa>\n    <div class=\"taal\" role=\"group\" aria-label=\"Taal / Language\"><button type=\"button\" data-taal=\"nl\" class=\"taal-aan\" aria-pressed=\"true\">NL<\u002Fbutton><button type=\"button\" data-taal=\"en\" aria-pressed=\"false\">EN<\u002Fbutton><\u002Fdiv>\n      <a href=\"#contact\" class=\"btn btn-primary\" style=\"color:var(--knop-tekst);border-color:transparent;font-family:var(--font-display);text-decoration:none\">Neem contact op<\u002Fa>\n  <\u002Fnav>\n\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px)\">\n\n    <!-- HERO -->\n    <section class=\"dc-split\" style=\"display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(28px,5vw,64px);align-items:center;padding:calc(3.5*var(--space-8)) 0 calc(2.5*var(--space-8))\">\n      <div data-reveal=\"\" data-reveal-dir=\"up\" style=\"animation:reveal-up 0.8s cubic-bezier(.2,.7,.2,1) 0ms both;\">\n        <span style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--diep-tekst);margin-bottom:14px\">LuzeX<\u002Fspan>\n        <h1 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(40px,5.6vw,66px);line-height:1.08;letter-spacing:-0.02em;margin:0 0 20px\">Wij geloven dat uw tijd naar uw vak hoort te gaan.<\u002Fh1>\n        <p style=\"font-size:18px;line-height:1.6;max-width:44ch;color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0\">Om elk vak heen groeit werk dat niemand ooit heeft ontworpen en dat iedereen is gaan accepteren. <span class=\"merk\">LuzeX<\u002Fspan> bouwt gerichte producten op maat.<\u002Fp>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:32px\">\n          <a href=\"#producten\" class=\"btn btn-primary\" style=\"color:var(--knop-tekst);border-color:transparent;font-family:var(--font-display);font-weight:700;font-size:15px;padding:12px 24px;text-decoration:none\">Bekijk de producten<\u002Fa>\n          <a href=\"#aanpak\" class=\"btn btn-ghost\" style=\"color:var(--brand-ink);font-family:var(--font-display);font-weight:700;font-size:15px;padding:12px 18px;text-decoration:none\">Hoe wij werken<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figure class=\"plate hero-plaat\" data-reveal=\"\" data-reveal-dir=\"scale\" style=\"margin:0;aspect-ratio:4/5;width:100%;animation:reveal-scale 0.8s cubic-bezier(.2,.7,.2,1) 0ms both;\">\n        <svg sc-camel-view-box=\"0 0 800 1000\" width=\"100%\" height=\"100%\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"Twee LuzeX-productvensters: een overzicht met regels en een samengevatte grafiek\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"hg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" style=\"stop-color:var(--t-verloop-1)\"/><stop offset=\"1\" style=\"stop-color:var(--t-verloop-2)\"/><\u002FlinearGradient><filter id=\"hs\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feDropShadow dx=\"0\" dy=\"16\" stdDeviation=\"22\" flood-opacity=\"0.16\" style=\"flood-color:var(--t-inkt)\"/><\u002Ffilter><clipPath id=\"hv\"><rect x=\"148\" y=\"556\" width=\"566\" height=\"360\" rx=\"22\"/><\u002FclipPath><\u002Fdefs><rect width=\"800\" height=\"1000\" fill=\"url(#hg)\"/><!-- achterste paneel: samengevat overzicht met grafiek --><g filter=\"url(#hs)\"><rect x=\"86\" y=\"120\" width=\"566\" height=\"392\" rx=\"22\" style=\"fill:var(--t-vlak)\"/><\u002Fg><circle cx=\"122\" cy=\"158\" r=\"7\" style=\"fill:var(--t-inkt)\"/><rect x=\"140\" y=\"152\" width=\"96\" height=\"11\" rx=\"5.5\" style=\"fill:var(--t-inkt)\"/><rect x=\"86\" y=\"186\" width=\"566\" height=\"1\" style=\"fill:var(--t-rand)\"/><polyline class=\"hero-lijn\" points=\"126,430 208,392 290,404 372,338 454,352 536,286 614,246\" fill=\"none\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--t-inkt)\"/><circle class=\"hero-punt\" cx=\"614\" cy=\"246\" r=\"7\" style=\"fill:var(--t-inkt)\"/><g style=\"fill:var(--t-lijn)\"><rect x=\"126\" y=\"220\" width=\"120\" height=\"10\" rx=\"5\"/><rect x=\"126\" y=\"248\" width=\"72\" height=\"10\" rx=\"5\"/><\u002Fg><g style=\"fill:var(--t-rand)\"><rect x=\"126\" y=\"462\" width=\"86\" height=\"8\" rx=\"4\"/><rect x=\"238\" y=\"462\" width=\"86\" height=\"8\" rx=\"4\"/><rect x=\"350\" y=\"462\" width=\"86\" height=\"8\" rx=\"4\"/><rect x=\"462\" y=\"462\" width=\"86\" height=\"8\" rx=\"4\"/><\u002Fg><!-- voorste paneel: regels met statusmarkering --><g filter=\"url(#hs)\"><rect x=\"148\" y=\"556\" width=\"566\" height=\"360\" rx=\"22\" style=\"fill:var(--t-vlak)\"/><\u002Fg><rect x=\"186\" y=\"592\" width=\"128\" height=\"11\" rx=\"5.5\" style=\"fill:var(--t-inkt)\"/><rect x=\"148\" y=\"626\" width=\"566\" height=\"1\" style=\"fill:var(--t-rand)\"/><g clip-path=\"url(#hv)\"><rect class=\"hero-regel\" style=\"--dx:-180px;--dy:-70px;--r:-7deg;--beurt:0.00s;fill:var(--t-lijn)\" x=\"186\" y=\"664\" width=\"380\" height=\"9\" rx=\"4.5\"/><rect class=\"hero-regel\" style=\"--dx:210px;--dy:-120px;--r:9deg;--beurt:0.09s;fill:var(--t-lijn)\" x=\"186\" y=\"708\" width=\"334\" height=\"9\" rx=\"4.5\"/><rect class=\"hero-regel\" style=\"--dx:-240px;--dy:90px;--r:6deg;--beurt:0.18s;fill:var(--t-lijn)\" x=\"186\" y=\"752\" width=\"288\" height=\"9\" rx=\"4.5\"/><rect class=\"hero-regel\" style=\"--dx:170px;--dy:140px;--r:-11deg;--beurt:0.27s;fill:var(--t-lijn)\" x=\"186\" y=\"796\" width=\"380\" height=\"9\" rx=\"4.5\"/><rect class=\"hero-regel\" style=\"--dx:-140px;--dy:190px;--r:4deg;--beurt:0.36s;fill:var(--t-lijn)\" x=\"186\" y=\"840\" width=\"334\" height=\"9\" rx=\"4.5\"/><g fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--t-inkt)\"><polyline class=\"hero-vink\" style=\"--beurt:0.00s\" points=\"638,668 646,676 660,660\"/><polyline class=\"hero-vink\" style=\"--beurt:0.09s\" points=\"638,712 646,720 660,704\"/><polyline class=\"hero-vink\" style=\"--beurt:0.18s\" points=\"638,756 646,764 660,748\"/><polyline class=\"hero-vink\" style=\"--beurt:0.27s\" points=\"638,800 646,808 660,792\"/><\u002Fg><\u002Fg><\u002Fsvg>\n      <\u002Ffigure>\n    <\u002Fsection>\n\n    <div class=\"divider-glass\"><\u002Fdiv>\n\n<\u002Fdiv>\n\n  <!-- AANPAK — volle banen, buiten de gecentreerde wrapper -->\n  <section id=\"aanpak\">\n      <div class=\"aanpak-in\" style=\"display:block;padding-top:clamp(56px,7vw,96px)\">\n        <span data-reveal=\"\" data-reveal-dir=\"up\" style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--diep-tekst);margin-bottom:14px;animation:reveal-up 0.8s cubic-bezier(.2,.7,.2,1) 0ms both;\">Hoe wij het doen<\u002Fspan>\n        <h2 data-reveal=\"\" data-reveal-dir=\"up\" style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.12;letter-spacing:-0.025em;margin:0;max-width:20ch;animation:reveal-up 0.8s cubic-bezier(.2,.7,.2,1) 90ms both;\">Wij beginnen bij het werk, niet bij de techniek.<\u002Fh2>\n      <\u002Fdiv>\n      <div class=\"aanpak-rij\">\n        <div class=\"aanpak-in\">\n          <div class=\"aanpak-tekst\" data-reveal=\"\" data-reveal-dir=\"left\" style=\"animation:reveal-left 0.9s cubic-bezier(.2,.7,.2,1) 0ms both;\">\n            <h3>LuzeX maakt ruimte voor wat beter kan.<\u002Fh3>\n            <p>Bij LuzeX kijken we naar wat beter kan. In processen, techniek en de dagelijkse praktijk is vaak meer mogelijk dan op het eerste gezicht lijkt. Door goed te kijken, vragen te stellen en praktische oplossingen te ontwikkelen, maken we ruimte voor verbetering. Niet om alles anders te doen, maar om te zorgen dat het beter werkt.<\u002Fp>\n            <p>LuzeX helpt organisaties met technische innovatie, procesverbetering en slimme oplossingen die in de praktijk waarde toevoegen.<\u002Fp>\n          <\u002Fdiv>\n          <figure class=\"aanpak-beeld\" data-reveal=\"\" data-reveal-dir=\"scale\" style=\"animation:reveal-scale 0.9s cubic-bezier(.2,.7,.2,1) 120ms both;\"><svg sc-camel-view-box=\"40 20 712 308\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><rect class=\"g-vz\" x=\"60\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><rect class=\"g-vz\" x=\"100\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><rect class=\"g-vz\" x=\"140\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><rect class=\"g-vz\" x=\"180\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><rect class=\"g-vz\" x=\"220\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><rect class=\"g-vlak\" x=\"300\" y=\"42\" width=\"96\" height=\"256\" rx=\"22\"/><path class=\"g-s\" d=\"M330 170 h36 M348 152 v36\" stroke-width=\"5\" stroke-linecap=\"round\"/><rect class=\"g-vz\" x=\"460\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><rect class=\"g-vz\" x=\"540\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><rect class=\"g-vz\" x=\"620\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><rect class=\"g-vz\" x=\"700\" y=\"60\" width=\"26\" height=\"220\" rx=\"13\"/><\u002Fsvg><\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"aanpak-rij aanpak-rij--gedraaid\">\n        <div class=\"aanpak-in\">\n          <div class=\"aanpak-tekst\" data-reveal=\"\" data-reveal-dir=\"left\" style=\"animation:reveal-left 0.9s cubic-bezier(.2,.7,.2,1) 0ms both;\">\n            <h3>Sommige dingen hoeven niet slimmer. Ze moeten gewoon beter.<\u002Fh3>\n            <p>Niet iedere oplossing hoeft ingewikkeld of vernieuwend te zijn. Soms werkt iets simpelweg niet goed genoeg. Dan is de beste oplossing niet méér techniek, maar een betere aanpak.<\u002Fp>\n            <p>LuzeX kijkt daarom altijd naar het doel: wat moet er beter, en wat is daarvoor nodig? Van technische verbeteringen tot procesoptimalisatie: we ontwikkelen oplossingen die praktisch werken en aantoonbaar verschil maken.<\u002Fp>\n          <\u002Fdiv>\n          <figure class=\"aanpak-beeld\" data-reveal=\"\" data-reveal-dir=\"scale\" style=\"animation:reveal-scale 0.9s cubic-bezier(.2,.7,.2,1) 120ms both;\"><svg sc-camel-view-box=\"46 44 684 268\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><path class=\"g-z\" d=\"M62 200 C110 70, 150 300, 196 150 S 268 60, 300 210 S 350 300, 382 140\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><path class=\"g-z\" d=\"M424 170 h44 m-15 -15 l15 15 -15 15\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".6\"/><path class=\"g-s\" d=\"M520 170 h180\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle class=\"g-punt\" cx=\"520\" cy=\"170\" r=\"11\"/><circle class=\"g-punt\" cx=\"700\" cy=\"170\" r=\"11\"/><\u002Fsvg><\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"aanpak-rij\">\n        <div class=\"aanpak-in\">\n          <div class=\"aanpak-tekst\" data-reveal=\"\" data-reveal-dir=\"left\" style=\"animation:reveal-left 0.9s cubic-bezier(.2,.7,.2,1) 0ms both;\">\n            <h3>Een goed idee is pas interessant als het ergens toe leidt.<\u002Fh3>\n            <p>Een goed idee is een begin, geen eindpunt. Bij LuzeX draait innovatie daarom niet om ideeën op zichzelf, maar om wat ze opleveren. Minder handelingen, een efficiënter proces, lagere kosten of simpelweg werk dat beter verloopt.<\u002Fp>\n            <p>We brengen ideeën terug naar de praktijk en kijken wat technisch en organisatorisch haalbaar is. Zo maken we van innovatie een concrete verbetering.<\u002Fp>\n          <\u002Fdiv>\n          <figure class=\"aanpak-beeld\" data-reveal=\"\" data-reveal-dir=\"scale\" style=\"animation:reveal-scale 0.9s cubic-bezier(.2,.7,.2,1) 120ms both;\"><svg sc-camel-view-box=\"56 92 596 164\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><circle class=\"g-z\" cx=\"118\" cy=\"170\" r=\"46\" stroke-width=\"3\" stroke-dasharray=\"8 9\"/><path class=\"g-z\" d=\"M204 170 h56 m-18 -16 l18 16 -18 16\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".6\"/><rect class=\"g-z\" x=\"304\" y=\"126\" width=\"88\" height=\"88\" rx=\"20\" stroke-width=\"3\"/><path class=\"g-z\" d=\"M436 170 h56 m-18 -16 l18 16 -18 16\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".6\"/><rect class=\"g-vlak\" x=\"536\" y=\"116\" width=\"108\" height=\"108\" rx=\"26\"/><path class=\"g-s\" d=\"M566 172 l20 20 34 -42\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg><\u002Ffigure>\n        <\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px)\">\n\n    <!-- PRODUCTEN -->\n    <section id=\"producten\" style=\"padding:calc(3.4*var(--space-8)) 0\">\n      <span data-reveal=\"\" data-reveal-dir=\"up\" style=\"display:block;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--diep-tekst);margin-bottom:14px;animation:reveal-up 0.8s cubic-bezier(.2,.7,.2,1) 0ms both;\">Wat dat oplevert<\u002Fspan>\n      <h2 data-reveal=\"\" data-reveal-dir=\"up\" style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1.12;letter-spacing:-0.025em;margin:0 0 18px;max-width:24ch;animation:reveal-up 0.8s cubic-bezier(.2,.7,.2,1) 90ms both;\">Twee producten draaien. Vier zijn onderweg.<\u002Fh2>\n      <p data-reveal=\"\" data-reveal-dir=\"up\" style=\"font-size:17px;line-height:1.6;max-width:50ch;color:color-mix(in srgb, var(--color-text) 74%, transparent);margin:0 0 clamp(44px,5vw,72px);animation:reveal-up 0.8s cubic-bezier(.2,.7,.2,1) 150ms both;\">Alle zes nemen ze werk weg dat niemand had willen doen.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:clamp(36px,5vw,72px);align-items:center\">\n        <div data-reveal=\"\" data-reveal-dir=\"left\" style=\"animation:reveal-left 0.9s cubic-bezier(.2,.7,.2,1) 0ms both;\">\n          <span class=\"tag\" style=\"background:color-mix(in srgb, var(--color-diep) 12%, transparent);color:var(--diep-tekst);font-weight:600\">Self-billing · zorgsector<\u002Fspan>\n          <h3 style=\"font-size:clamp(34px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;font-weight:700;margin:20px 0 14px\">ACCRD<\u002Fh3>\n          <p style=\"font-size:19px;line-height:1.55;margin:0 0 16px;max-width:40ch\">Minder administratie, minder fouten, meer tijd voor belangrijke zaken.<\u002Fp>\n          <p style=\"font-size:16.5px;line-height:1.65;margin:0 0 30px;max-width:44ch;color:color-mix(in srgb, var(--color-text) 76%, transparent)\">Hoofdaannemer levert de factuur, onderaannemer keurt hem goed. Zelfstandigheid gewaarborgd.<\u002Fp>\n          \n          <a href=\"https://accrd.luzex.nl\" class=\"btn btn-primary\" style=\"color:var(--knop-tekst);border-color:transparent;font-family:var(--font-display);font-weight:700;font-size:15px;padding:13px 26px;text-decoration:none\">Naar ACCRD<\u002Fa>\n        <\u002Fdiv>\n        <figure class=\"acc-plaat\" data-reveal=\"\" data-reveal-dir=\"scale\" style=\"margin:0;animation:reveal-scale 0.9s cubic-bezier(.2,.7,.2,1) 140ms both;\"><svg sc-camel-view-box=\"0 0 640 546\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><defs><filter id=\"pa\" x=\"-25%\" y=\"-25%\" width=\"150%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"16\" stdDeviation=\"22\" flood-opacity=\".17\" style=\"flood-color:var(--t-inkt)\"/><\u002Ffilter><\u002Fdefs><rect x=\"24\" y=\"18\" width=\"592\" height=\"380\" rx=\"26\" filter=\"url(#pa)\" style=\"fill:var(--t-vlak)\"/><rect x=\"60\" y=\"56\" width=\"132\" height=\"13\" rx=\"6.5\" style=\"fill:var(--t-inkt)\"/><rect x=\"24\" y=\"96\" width=\"592\" height=\"1\" style=\"fill:var(--t-rand)\"/><rect x=\"60\" y=\"130\" width=\"300\" height=\"11\" rx=\"5.5\" style=\"fill:var(--t-lijn)\"/><rect x=\"60\" y=\"152\" width=\"188\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-lijn-zacht)\"/><rect x=\"60\" y=\"192\" width=\"256\" height=\"11\" rx=\"5.5\" style=\"fill:var(--t-lijn)\"/><rect x=\"60\" y=\"214\" width=\"148\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-lijn-zacht)\"/><rect x=\"60\" y=\"254\" width=\"212\" height=\"11\" rx=\"5.5\" style=\"fill:var(--t-lijn)\"/><rect x=\"60\" y=\"276\" width=\"188\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-lijn-zacht)\"/><rect x=\"60\" y=\"316\" width=\"300\" height=\"11\" rx=\"5.5\" style=\"fill:var(--t-lijn)\"/><rect x=\"60\" y=\"338\" width=\"148\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-lijn-zacht)\"/><path class=\"acc-vink acc-vink--1\" d=\"M524 138 l14 14 26 -30\" fill=\"none\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--t-inkt)\"/><path class=\"acc-vink acc-vink--2\" d=\"M524 200 l14 14 26 -30\" fill=\"none\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--t-inkt)\"/><path class=\"acc-vink acc-vink--3\" d=\"M524 262 l14 14 26 -30\" fill=\"none\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--t-inkt)\"/><circle cx=\"544\" cy=\"331\" r=\"17\" fill=\"none\" stroke-width=\"3\" stroke-dasharray=\"6 7\" style=\"stroke:var(--t-stippel)\"/><g class=\"acc-knop\"><rect x=\"176\" y=\"424\" width=\"392\" height=\"98\" rx=\"22\" style=\"fill:var(--t-diep)\"/><rect x=\"214\" y=\"458\" width=\"150\" height=\"12\" rx=\"6\" style=\"fill:var(--t-diep-op)\"/><rect x=\"214\" y=\"482\" width=\"96\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-diep-zacht)\"/><path d=\"M470 473 h40 m-14 -14 l14 14 -14 14\" fill=\"none\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--t-diep-op)\"/><\u002Fg><\u002Fsvg><\u002Ffigure>\n      <\u002Fdiv>\n\n\n    <!-- De drie stappen, op de donkerbruine baan: het werk reist van hoofdaannemer\n         naar onderaannemer naar uitbetaling en elke stap licht op als het aankomt. -->\n    <section class=\"band-diep stroom-baan\" aria-label=\"Zo werkt ACCRD\" style=\"padding:calc(2.6*var(--space-8)) clamp(20px,5vw,72px);margin-top:clamp(44px,5vw,72px)\">\n      <div style=\"max-width:1200px;margin:0 auto\">\n        <div class=\"stroom\" aria-hidden=\"true\"><span class=\"stroom-lijn\"><\u002Fspan><span class=\"stroom-werk\"><\u002Fspan><\u002Fdiv>\n        <ol style=\"list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:clamp(20px,3vw,32px)\"><li class=\"stroom-stap\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;border:1.5px solid rgba(255,255,255,0.55);font-size:14px;font-weight:700;margin-bottom:14px\">1<\u002Fspan><span style=\"display:block;font-weight:700;font-size:17px;letter-spacing:-0.01em\">Hoofdaannemer<\u002Fspan><span style=\"display:block;font-size:15.5px;line-height:1.5;color:#e3d3c0;margin-top:4px\">Zetten een factuur klaar op basis van de geregistreerde uren per onderaannemer.<\u002Fspan><\u002Fli><li class=\"stroom-stap\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;border:1.5px solid rgba(255,255,255,0.55);font-size:14px;font-weight:700;margin-bottom:14px\">2<\u002Fspan><span style=\"display:block;font-weight:700;font-size:17px;letter-spacing:-0.01em\">Onderaannemer<\u002Fspan><span style=\"display:block;font-size:15.5px;line-height:1.5;color:#e3d3c0;margin-top:4px\">Keurt zijn factuur goed, of corrigeert waar nodig.<\u002Fspan><\u002Fli><li class=\"stroom-stap\"><span style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;border:1.5px solid rgba(255,255,255,0.55);font-size:14px;font-weight:700;margin-bottom:14px\">3<\u002Fspan><span style=\"display:block;font-weight:700;font-size:17px;letter-spacing:-0.01em\">Uitbetalen<\u002Fspan><span style=\"display:block;font-size:15.5px;line-height:1.5;color:#e3d3c0;margin-top:4px\">Na goedkeuring volgt uitbetaling. Snel en gemakkelijk.<\u002Fspan><\u002Fli><\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n      <div data-reveal=\"\" data-reveal-dir=\"up\" style=\"margin-top:clamp(56px,6vw,88px);padding-top:clamp(36px,4vw,52px);border-top:1px solid var(--color-divider);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:clamp(36px,5vw,72px);align-items:center;animation:reveal-up 0.8s cubic-bezier(.2,.7,.2,1) 0ms both;\">\n        <div>\n          <span class=\"tag\" style=\"background:transparent;border:1px solid var(--color-diep);color:var(--diep-tekst);font-weight:600\">Community · zorgsector<\u002Fspan>\n          <h3 style=\"font-size:clamp(34px,4vw,52px);line-height:1.05;letter-spacing:-0.03em;font-weight:700;margin:20px 0 14px\">CMMNTY<\u002Fh3>\n          <p style=\"font-size:19px;line-height:1.55;margin:0 0 16px;max-width:40ch\">Artikelen, een zzp-directory en een nieuwsbrief voor zorgprofessionals.<\u002Fp>\n          <p style=\"font-size:16.5px;line-height:1.65;margin:0 0 30px;max-width:44ch;color:color-mix(in srgb, var(--color-text) 76%, transparent)\">Innovatie in de zorg volgen, collega-zzp'ers vinden en op de hoogte blijven — allemaal op één plek.<\u002Fp>\n          <ol style=\"list-style:none;padding:0;margin:0 0 32px\"><li style=\"display:flex;gap:16px;align-items:flex-start;margin-bottom:18px\"><span style=\"flex:0 0 auto;width:30px;height:30px;border-radius:999px;border:1.5px solid var(--color-diep);color:var(--diep-tekst);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-top:1px\">1<\u002Fspan><span><span style=\"display:block;font-weight:700;font-size:17px;letter-spacing:-0.01em\">Artikelen<\u002Fspan><span style=\"display:block;font-size:15.5px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-top:2px\">Gratis en Pro-artikelen over innovatie in de zorg, samengevat en overzichtelijk.<\u002Fspan><\u002Fspan><\u002Fli><li style=\"display:flex;gap:16px;align-items:flex-start;margin-bottom:18px\"><span style=\"flex:0 0 auto;width:30px;height:30px;border-radius:999px;border:1.5px solid var(--color-diep);color:var(--diep-tekst);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-top:1px\">2<\u002Fspan><span><span style=\"display:block;font-weight:700;font-size:17px;letter-spacing:-0.01em\">Directory<\u002Fspan><span style=\"display:block;font-size:15.5px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-top:2px\">Vind zzp'ers op specialisme en regio, met een kort profiel.<\u002Fspan><\u002Fspan><\u002Fli><li style=\"display:flex;gap:16px;align-items:flex-start;margin-bottom:18px\"><span style=\"flex:0 0 auto;width:30px;height:30px;border-radius:999px;border:1.5px solid var(--color-diep);color:var(--diep-tekst);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-top:1px\">3<\u002Fspan><span><span style=\"display:block;font-weight:700;font-size:17px;letter-spacing:-0.01em\">Nieuwsbrief<\u002Fspan><span style=\"display:block;font-size:15.5px;line-height:1.5;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-top:2px\">Automatisch verstuurd, met alleen wat voor u beschikbaar is.<\u002Fspan><\u002Fspan><\u002Fli><\u002Fol>\n          <a href=\"https://cmmnty.luzex.nl\" class=\"btn btn-primary\" style=\"color:var(--knop-tekst);border-color:transparent;font-family:var(--font-display);font-weight:700;font-size:15px;padding:13px 26px;text-decoration:none\">Naar CMMNTY<\u002Fa>\n        <\u002Fdiv>\n        <figure data-reveal=\"\" data-reveal-dir=\"scale\" style=\"margin:0;animation:reveal-scale 0.9s cubic-bezier(.2,.7,.2,1) 140ms both;\"><svg sc-camel-view-box=\"0 0 640 546\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\"><defs><filter id=\"pc\" x=\"-25%\" y=\"-25%\" width=\"150%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"16\" stdDeviation=\"22\" flood-opacity=\".17\" style=\"flood-color:var(--t-inkt)\"/><\u002Ffilter><\u002Fdefs><rect x=\"24\" y=\"18\" width=\"360\" height=\"440\" rx=\"26\" filter=\"url(#pc)\" style=\"fill:var(--t-vlak)\"/><rect x=\"56\" y=\"52\" width=\"120\" height=\"13\" rx=\"6.5\" style=\"fill:var(--t-inkt)\"/><rect x=\"24\" y=\"92\" width=\"360\" height=\"1\" style=\"fill:var(--t-rand)\"/><rect x=\"56\" y=\"122\" width=\"296\" height=\"86\" rx=\"14\" style=\"fill:var(--t-vlak-zacht)\"/><rect x=\"56\" y=\"222\" width=\"220\" height=\"11\" rx=\"5.5\" style=\"fill:var(--t-lijn)\"/><rect x=\"56\" y=\"244\" width=\"296\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-lijn-zacht)\"/><rect x=\"56\" y=\"262\" width=\"260\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-lijn-zacht)\"/><rect x=\"56\" y=\"298\" width=\"80\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-diep-zacht)\"/><rect x=\"56\" y=\"336\" width=\"220\" height=\"11\" rx=\"5.5\" style=\"fill:var(--t-lijn)\"/><rect x=\"56\" y=\"358\" width=\"296\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-lijn-zacht)\"/><rect x=\"56\" y=\"376\" width=\"220\" height=\"9\" rx=\"4.5\" style=\"fill:var(--t-lijn-zacht)\"/><rect x=\"56\" y=\"412\" width=\"80\" height=\"
